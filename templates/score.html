{% extends "base.html" %}
{% block title %}내 악보 — Aura Score{% endblock %}
{% block wrap_class %}wide{% endblock %}

{% block content %}
<div class="library-head">
  <a class="back" href="{{ url_for('my_scores') }}">← 내 악보</a>
  <span class="meta" id="score-created"></span>
</div>
<p class="hint" id="score-loading">악보를 불러오는 중…</p>

{% include "compose/result.html" %}

<form class="delete-form" method="post" action="{{ url_for('delete_score', score_id=score_id) }}"
      onsubmit="return confirm('이 악보를 삭제할까요? 삭제하면 되돌릴 수 없습니다.')">
  <button class="btn danger" type="submit">이 악보 삭제</button>
</form>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@2.1.3/build/opensheetmusicdisplay.min.js"></script>
<script type="module">
  import { showScore } from "{{ url_for('static', filename='js/score_view.js') }}";

  const loading = document.getElementById("score-loading");
  try {
    const response = await fetch("{{ url_for('api_saved_score', score_id=score_id) }}");
    const score = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(score.error || `서버 오류가 났습니다 (${response.status}).`);
    loading.hidden = true;
    document.title = `${score.title} — Aura Score`;
    document.getElementById("score-created").textContent = `${score.created}에 만듦`;
    await showScore(score);
  } catch (failure) {
    loading.textContent = failure instanceof TypeError ? "서버에 연결하지 못했습니다." : failure.message;
    loading.className = "form-error";
  }
</script>
{% endblock %}
