{% extends "base.html" %}

{% block content %}
{% if user %}
<div class="card hero">
  <h2>{{ user.name }}님, 환영합니다</h2>
  <p class="hero-lead">
    악기 구성과 분위기, 템포를 고르면 GPT 가 악기별 파트가 나뉜
    오케스트라 총보를 써 드립니다.
  </p>
  <div class="hero-actions">
    <a class="btn primary" href="{{ url_for('new_score') }}">악보 만들기</a>
  </div>
</div>
{% else %}
<div class="card hero">
  <h2>글로 적은 음악을 오케스트라 악보로</h2>
  <p class="hero-lead">
    “새벽 안개가 걷히는 느린 현악 합주”처럼 원하는 음악을 적으면
    악기별 파트가 나뉜 총보를 만들어 드립니다. 먼저 로그인해 주세요.
  </p>
  <div class="hero-actions">
    <a class="btn primary" href="{{ url_for('signup') }}">회원가입</a>
    <a class="btn" href="{{ url_for('login') }}">로그인</a>
  </div>
</div>
{% endif %}
{% endblock %}
