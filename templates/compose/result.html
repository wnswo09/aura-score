<section class="card result" id="result" hidden>
  <div class="result-head">
    <div>
      <h2 id="score-title"></h2>
      <p class="meta" id="score-meta"></p>
    </div>
    <div class="result-actions">
      <button class="btn primary" id="play" type="button">▶ 재생</button>
      <button class="btn" id="download" type="button">MusicXML 다운로드</button>
    </div>
  </div>
  <p class="form-error" id="play-error" hidden></p>
  <p class="score-desc" id="score-desc"></p>
  <ol class="flow" id="score-flow"></ol>
  <p class="hint" id="score-repetition"></p>
  <p class="hint" id="score-repairs" hidden></p>
  <div class="paper"><div id="score"></div></div>
</section>
